{% extends "base.html" %}
{% block title %}Novo projeto | ProspectAI{% endblock %}
{% block breadcrumb %}
<nav class="record-breadcrumb" aria-label="Localização"><a href="{% url 'gestao_lista' 'projetos' %}">Projetos</a></nav>
{% endblock %}
{% block heading %}Novo projeto{% endblock %}
{% block content %}
<form method="post" class="panel record-form">
    {% csrf_token %}
    {% include "record_fields.html" with form=form only %}
    <div class="record-actions record-form-actions">
        <button class="button primary" type="submit">Criar projeto</button>
        <a class="button secondary" href="{% url 'gestao_lista' 'projetos' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
