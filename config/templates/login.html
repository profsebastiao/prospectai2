{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | ProspectAI</title>
<link rel="stylesheet" href="{% static 'accounts/app.css' %}?v=page-scrollbar-1">
</head>
<body class="login-screen">
<main class="panel login-card">
<div class="brand"><span class="brand-symbol" aria-hidden="true">P<span>A</span></span><strong>ProspectAI</strong></div>
<h1>Entre na sua conta</h1>
<p class="record-muted">Acesse seus clientes, projetos e tarefas.</p>
{% if form.errors %}<p class="record-form-error" role="alert">Usu&aacute;rio ou senha inv&aacute;lidos. Confira seus dados e tente novamente.</p>{% endif %}
<form method="post">
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
<div class="record-field"><label for="{{ form.username.id_for_label }}">Usu&aacute;rio</label>
{{ form.username }}</div>
<div class="record-field"><label for="{{ form.password.id_for_label }}">Senha</label>
{{ form.password }}</div>
<div class="record-form-actions"><button class="button primary" type="submit">Entrar</button></div>
</form>
</main>
</body>
</html>
